header img{height:34px;width:auto}
.live{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border:1px solid var(--line);border-radius:999px;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.05)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--or);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(236,77,0,.55)}70%{box-shadow:0 0 0 10px rgba(236,77,0,0)}100%{box-shadow:0 0 0 0 rgba(236,77,0,0)}}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0 60px}
.in{animation:up .7s ease both}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--or);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:26px}
.eyebrow:before,.eyebrow:after{content:"";width:40px;height:1px;background:var(--or);opacity:.5}
h1{color:var(--ink);font-weight:900;font-size:clamp(40px,8.2vw,104px);line-height:1.04;letter-spacing:-.035em;max-width:1000px;margin-bottom:46px}
h1 em{font-style:normal;color:var(--or)}
.soon{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:999px;padding:18px 36px;font-weight:800;font-size:clamp(15px,2vw,20px);letter-spacing:3px;text-transform:uppercase;box-shadow:0 8px 28px rgba(12,11,10,.22),0 4px 16px rgba(236,77,0,.28)}
.soon i{width:10px;height:10px;border-radius:50%;background:var(--or)}
footer{border-top:1px solid var(--line);font-size:13px;font-weight:600;color:#64748b}
footer a{color:var(--ink);text-decoration:none}footer a:hover{color:var(--or)}
@media(max-width:600px){header img{height:26px}.live{padding:8px 12px;font-size:11px}footer{flex-direction:column;gap:4px;text-align:center}.eyebrow:before,.eyebrow:after{width:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
